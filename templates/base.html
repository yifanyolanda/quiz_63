<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>话题知识小测</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#202b42;font:16px/1.6 system-ui,sans-serif}main{max-width:660px;margin:5vh auto;padding:28px;background:white;border-radius:20px;box-shadow:0 8px 36px #17284b0c}h1{font-size:26px}h2{font-size:22px}button,.button{display:inline-block;border:0;border-radius:10px;padding:13px 20px;background:#465ce1;color:white;font:inherit;cursor:pointer;text-decoration:none;margin:8px 0}button:disabled{opacity:.5;cursor:default}input:not([type=radio]){width:100%;padding:12px;border:1px solid #cbd2e1;border-radius:8px;font:inherit}label.option{display:flex;gap:12px;border:1px solid #dbe0eb;padding:13px;border-radius:10px;margin:12px 0;cursor:pointer}label.option:has(input:checked){background:#eef0ff;border-color:#465ce1}.muted{color:#6a758a}.timer{color:#bd3b38;font-weight:bold}.score{font-size:64px;color:#465ce1;font-weight:700}.error{color:#ba3434}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid #eee;padding:8px;overflow-wrap:anywhere}.identity{overflow-wrap:anywhere}small{display:block} @media(max-width:700px){main{margin:16px;padding:22px}}
